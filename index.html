<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), cv = $('#game'), ctx = cv.getContext('2d');
const goCv = $('#goYolk'), goCtx = goCv.getContext('2d');
const el = {
  start:$('#start'), over:$('#over'), brand:$('#brand'), hud:$('#hud'), hint:$('#hint'), toast:$('#toast'),
  time:$('#hudTime'), score:$('#hudScore'), lv:$('#hudLv'),
  btnStart:$('#btnStart'), btnRetry:$('#btnRetry'), btnBrand:$('#btnBrand'), btnBrandRetry:$('#btnBrandRetry'), btnClose:$('#btnClose'),
  fScore:$('#finalScore'), newBest:$('#newBest'),
  startBest:$('#startBest'), scoreBox:$('#hudScoreBox'), meter:$('#hudMeter'),
  overTitle:$('#overTitle'), overMsg:$('#overMsg'), card:$('#brandCard'),
  nick:$('#nick'), btnShare:$('#btnShare'), shareMsg:$('#shareMsg'), shareUrl:$('#shareUrl')
};
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- world constants (logical units; world is always 640 tall) ---------- */
const H = 640, FLOOR = H - 64, ATTRACT = FLOOR;
const R = 22, HIT = 18.5;
const GRAV = 1550, JUMP = -520, MAXFALL = 900;
const DURATION = 30, HIT_COST = 10, INVULN = 1.0;
const END_SLIDE = .55, END_JUMP = .75, END_PEEK = .6;   // ending: bag slides in, yolk jumps in, yolk peeks out   // a run lasts 30s; start at 100 points, each hit costs 10
let W = 360, DPR = 1;

/* ---------- state ---------- */
let state = 'start';            // start | ready | play | ending | over
let clock = 0, t = 0, passed = 0, score = 100, hits = 0, level = 1, invuln = 0, endT = 0, overLook = 'happy';
let best = 0, spawnIn = 0, lastCenter = FLOOR / 2, shake = 0, flash = 0;
let floorA = 1, bgScroll = 0, sceneD = 0, jmp = null, popupTimer = 0, enableTimer = 0, toastTimer = 0;
let obs = [], parts = [];
const Y = { x: 0, y: ATTRACT - R, vy: 0, d: 0, dv: 0, rest: 0, wob: 0, ph: 0, look: 'happy', ouchT: 0, blink: 0, blinkT: 2 };
try { best = parseInt(localStorage.getItem('yolkItBeBest100') || '0', 10) || 0; } catch (e) { best = 0; }

function show(e, v) { e.hidden = !v; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* ---------- difficulty curve ---------- */
const curSpeed = () => Math.min(190 + t * 7.5, 340);
const curGap = () => Math.max(158, 226 - t * 3.2);
const curSpacing = () => Math.max(232, 300 - t * 3);

/* ---------- sizing ---------- */
function fit() {
  const r = stage.getBoundingClientRect();
  if (!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = clamp(Math.round(H * r.width / r.height), 250, 640);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
}

/* ---------- yolk character ---------- */
function drawYolk(c, x, y, r, o) {
  c.save();
  c.translate(x, y);
  c.scale(o.sx, o.sy);
  const N = 56;
  c.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2;
    const k = 1 + o.wob * (Math.sin(3 * a + o.ph) + 0.6 * Math.sin(2 * a - 1.3 * o.ph));
    const px = Math.cos(a) * r * k, py = Math.sin(a) * r * k;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
  c.shadowColor = 'rgba(217,143,0,.35)'; c.shadowBlur = r * .5; c.shadowOffsetY = r * .18;

/* ---------- update ---------- */

  const ss = String(score);
  if (ss !== hudS) { hudS = ss; el.score.textContent = ss; el.meter.style.width = score + '%'; }

    show(el.start, false); show(el.over, true);
  } catch (e) {}
}
function leaveShared() {
  sharedView = false; nick = ownNick; score = 100; show(el.over, false); show(el.start, true);
  el.btnRetry.textContent = '다시 도전하기';
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}
const CROWN = ['o.....o.....o', 'oo...ooo...oo', 'oyo.oyyyo.oyo', 'ohyoyyyyyoyyo', 'oyyyyyyyyyyyo', 'oybyyyryyybyo', 'ooooooooooooo'].map(r => r.length === 13 ? r : r.padEnd(13, '.'));
const CROWN_COL = { o: '#3A2710', y: '#FFD21F', h: '#FFF3A8', r: '#E5382D', b: '#3E7CC4' };
function drawCrown(c, cx, topY, px) {               // pixel-art crown sitting on the yolk's head
  const x0 = Math.round(cx - 6.5 * px), y0 = Math.round(topY - 6 * px);
  CROWN.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const col = CROWN_COL[row[i]]; if (col) { c.fillStyle = col; c.fillRect(x0 + i * px, y0 + j * px, px, px); } } });
}
function shareUrl() {
  try { const l = location; if (/^https?:$/.test(l.protocol) && !/(claude|anthropic)/i.test(l.hostname)) return l.origin + l.pathname; } catch (e) {}
  return FALLBACK_URL;
}
let shareTimer = 0;
function shareNote(msg, keep) {
  el.shareMsg.textContent = msg; clearTimeout(shareTimer);
  if (!keep) shareTimer = setTimeout(() => { el.shareMsg.textContent = ''; }, 3200);
}
async function copyText(txt) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
    const ok = document.execCommand('copy'); ta.remove(); return !!ok;
  } catch (e) { return false; }
}
function makeResultImage() {
  return new Promise(resolve => {
    const w = 600, h = 820, [cvs, c] = mkc(w, h);
    const INK = '#3A2710', T = (s, x, y, size, fill, stroke, lw) => {
      c.font = '700 ' + size + 'px YolkPixel, system-ui, sans-serif'; c.textAlign = 'center'; c.lineJoin = 'round';
      if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.strokeText(s, x, y); }
      c.fillStyle = fill; c.fillText(s, x, y);
    };
    c.fillStyle = '#FFE8A8'; c.fillRect(0, 0, w, h); c.fillStyle = '#FFF2CE'; c.fillRect(0, h * .5, w, h * .5);
    c.fillStyle = 'rgba(58,39,16,.3)'; c.fillRect(48, 60, 504, 720);
    c.fillStyle = INK; c.fillRect(36, 40, 528, 732); c.fillStyle = '#FFF7E3'; c.fillRect(42, 46, 516, 720); c.fillStyle = '#FFE58A'; c.fillRect(42, 46, 516, 6);
    const chip = (nick ? nick + '님의 결과' : 'RESULT');
    c.font = '700 26px YolkPixel'; const cw = c.measureText(chip).width + 40;
    c.fillStyle = INK; c.fillRect(300 - cw / 2, 84, cw, 46); T(chip, 300, 117, 26, '#FFE58A');
    const k = c.canvas, yl = { sx: 1, sy: 1, wob: 0, ph: 0, look: overLook, blink: false };
    c.fillStyle = 'rgba(58,39,16,.25)'; c.beginPath(); c.ellipse(300, 330, 74, 12, 0, 0, Math.PI * 2); c.fill();
    drawYolk(c, 300, 262, 66, yl);
    if (score === 100) drawCrown(c, 300, 196 + 16, 7);
    c.font = '700 24px YolkPixel'; const lines = [];
    for (const para of String(el.overMsg.textContent).split('\n')) { let cur = ''; for (const wd of para.split(' ')) { const tr = cur ? cur + ' ' + wd : wd; if (cur && c.measureText(tr).width > 440) { lines.push(cur); cur = wd; } else cur = tr; } lines.push(cur); }
    const bh = 24 + lines.length * 34;
    c.fillStyle = '#2B1B0A'; c.fillRect(60, 362, 480, bh); c.strokeStyle = '#6A4A24'; c.lineWidth = 4; c.strokeRect(62, 364, 476, bh - 4);
    lines.forEach((l, i) => T(l, 300, 362 + 34 + i * 34 - 4, 24, '#FFE58A'));
    const y0 = 362 + bh + 42;
    T('FINAL SCORE', 300, y0, 24, INK);
    c.font = '700 130px YolkPixel'; const sw1 = c.measureText(String(score)).width; c.font = '700 40px YolkPixel'; const sw2 = c.measureText('/100').width + 12;
    const sx0 = 300 - (sw1 + sw2) / 2;
    c.textAlign = 'left'; c.font = '700 130px YolkPixel'; c.lineJoin = 'round'; c.lineWidth = 22; c.strokeStyle = INK; c.strokeText(String(score), sx0, y0 + 128); c.fillStyle = '#FFD21F'; c.fillText(String(score), sx0, y0 + 128);
    c.font = '700 40px YolkPixel'; c.lineWidth = 10; c.strokeText('/100', sx0 + sw1 + 12, y0 + 128); c.fillStyle = '#fff'; c.fillText('/100', sx0 + sw1 + 12, y0 + 128);
    T('탱글노른자 챌린지', 300, 724, 26, INK);
    T('LET EAT BE', 300, 756, 20, '#B8860B');
    cvs.toBlob(b => resolve(b), 'image/png');
  });
}
async function share() {
  const url = resultUrl();
  const data = { title: '탱글노른자 챌린지 | LET EAT BE', text: (nick ? nick + '님이 ' : '') + '탱글노른자 챌린지에서 ' + score + '점! 너도 도전해 봐 🥚', url };
  const touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  if (touch && navigator.share) {
    try {
      const blob = await makeResultImage();
      if (blob && navigator.canShare) {
        const file = new File([blob], 'yolk-result.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: data.title, text: data.text + '\n' + url }); return; }
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.share(data); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (await copyText(url)) { shareNote('링크가 복사됐어요!'); return; }
  el.shareUrl.value = url; show(el.shareUrl, true);
  try { el.shareUrl.focus(); el.shareUrl.select(); } catch (e) {}
  shareNote('아래 링크를 복사해서 공유해 주세요', true);
}

/* ---------- input ---------- */

(function initScene() {

    Promise.race([document.fonts.load('700 11px YolkPixel', '청계천'), new Promise(r => setTimeout(r, 1800))]).then(go, go);

let last = performance.now();
document.addEventListener('visibilitychange', () => { last = performance.now(); });
function frame(now) {
