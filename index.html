<html lang="ko">
<head>
<meta charset="utf-8">

<style>
/* Layout: one full-height portrait stage (max 480px wide). A 640-unit-tall canvas world holds the game;
   DOM layers sit on top for the start screen, HUD, game over panel and the brand ending popup. */
:root{
  --cream:#FFF7E3;
  --cream-deep:#FFEDBE;
  --butter:#FFE58A;
  --gold:#F7B500;
  --gold-deep:#C98300;
  --ink:#3A2710;
  --ink-soft:#7A5C2E;
  --font-display:'Unbounded','Arial Rounded MT Bold','Noto Sans KR',system-ui,sans-serif;
  --font-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
  --font-serif:'Noto Serif KR','Nanum Myeongjo','Apple Myungjo',serif;
}
html{height:100%;box-sizing:border-box}
body{
  height:100%;margin:0;display:flex;justify-content:center;overflow:hidden;
  background:var(--cream-deep) radial-gradient(ellipse at 50% 30%,#FFF7E3 0%,#FFE9AE 100%);
  color:var(--ink);font-family:var(--font-body);
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
#stage{
  position:relative;flex:none;height:100%;overflow:hidden;
  width:min(100%,480px);
  width:min(100%,480px,82dvh);
  container-type:size;
  background:var(--cream);
  box-shadow:0 0 0 1px rgba(201,131,0,.16),0 30px 80px -30px rgba(120,76,16,.45);
}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- shared bits ---------- */
.screen{
  position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:fadeIn .35s ease both;
}
.eyebrow{
  margin:0;font-family:var(--font-display);font-weight:500;font-size:11px;letter-spacing:.28em;color:var(--ink-soft);
}
.eyebrow span{color:var(--gold-deep)}
.lbl{font-family:var(--font-display);font-weight:500;font-size:9.5px;letter-spacing:.2em;color:var(--ink-soft)}

.btn{
  appearance:none;border:0;cursor:pointer;color:var(--ink);
  font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.2em;
  padding:17px 44px;border-radius:999px;
  background:linear-gradient(180deg,#FFE680 0%,#FFC51F 55%,#F6AC00 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -3px 0 rgba(176,104,0,.28),0 14px 28px -10px rgba(201,131,0,.7);
  transition:transform .16s cubic-bezier(.3,1.6,.5,1),filter .2s;
}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:scale(1.05,.92)}
.btn:focus-visible,.close:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-ko{font-family:var(--font-body);font-weight:700;letter-spacing:.04em;font-size:16px}
.btn-ghost{
  background:none;box-shadow:none;color:var(--ink-soft);font-family:var(--font-body);font-weight:500;
  letter-spacing:.02em;font-size:13.5px;padding:10px 14px;text-decoration:underline;text-underline-offset:4px;
}
.btn-ghost:hover{filter:none;color:var(--ink)}
.btn-ghost:active{transform:none}

/* ---------- start screen ---------- */
.start{
  justify-content:space-between;text-align:center;
  padding-top:32px;padding-bottom:40px;
  padding-top:clamp(22px,7cqh,60px);padding-bottom:clamp(26px,8cqh,64px);
}
.start h1{margin:14px 0 0;font-family:var(--font-display);font-weight:800;color:var(--ink);letter-spacing:-.01em}
.t1,.t2{display:block}
.t1{font-size:72px;font-size:clamp(50px,min(22cqw,12cqh),100px);line-height:.98}
.t2{font-size:38px;font-size:clamp(28px,min(11.5cqw,6.2cqh),54px);line-height:1.1;margin-top:.08em;letter-spacing:.06em}
.o{
  display:inline-block;position:relative;width:.76em;height:.76em;border-radius:50%;margin:0 .02em;
  background:radial-gradient(circle at 34% 28%,#FFF6C2 0 10%,#FFE066 32%,#FFC21A 64%,#E88F00 100%);
  box-shadow:inset -4px -6px 9px rgba(190,100,0,.45),inset 3px 4px 6px rgba(255,255,255,.55),0 8px 16px rgba(217,143,0,.35);
  transform-origin:50% 100%;animation:oBounce 1.4s cubic-bezier(.3,0,.3,1) infinite;
}
.o::before{
  content:"";position:absolute;left:30%;top:47%;width:.1em;height:.14em;border-radius:50%;
  background:var(--ink);box-shadow:.24em 0 0 var(--ink);
}
.o::after{
  content:"";position:absolute;left:18%;top:13%;width:.26em;height:.13em;border-radius:50%;
  background:rgba(255,255,255,.88);transform:rotate(-32deg);
}
@keyframes oBounce{
  0%{transform:translateY(0) scale(1.14,.84)}
  22%{transform:translateY(-.22em) scale(.93,1.08)}
  50%{transform:translateY(-.3em) scale(1,1)}
  78%{transform:translateY(-.02em) scale(.97,1.04)}
  100%{transform:translateY(0) scale(1.14,.84)}
}
.sub{
  display:inline-block;margin:18px 0 0;padding:9px 18px;border-radius:999px;background:var(--ink);color:var(--butter);
  font-family:var(--font-display);font-weight:600;font-size:11.5px;letter-spacing:.16em;
}
.lead{margin:16px 0 0;font-size:15px;line-height:1.65;font-weight:500;color:var(--ink-soft);text-wrap:balance}
.start-bottom{display:flex;flex-direction:column;align-items:center;gap:14px}
.how{margin:0;font-family:var(--font-display);font-size:10px;letter-spacing:.24em;color:var(--ink-soft);font-weight:500}
.best{margin:0;font-family:var(--font-display);font-size:11px;letter-spacing:.2em;color:var(--gold-deep);font-weight:600}
.best b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
.hud{
  position:absolute;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding-top:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;
}
.stat{
  display:flex;flex-direction:column;gap:3px;min-width:84px;padding:9px 15px 10px;border-radius:16px;
  background:rgba(255,250,235,.8);border:1px solid rgba(201,131,0,.28);backdrop-filter:blur(6px);
}
.stat.r{align-items:flex-end}
.meter{display:block;align-self:stretch;height:4px;margin-top:3px;border-radius:99px;background:rgba(58,39,16,.12);overflow:hidden}
.meter i{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#FFC51F,#F7A800);transition:width .3s ease}
.stat.hit{animation:hitPulse .55s ease}
@keyframes hitPulse{
  0%{transform:scale(1)}
  20%{transform:scale(1.14);background:rgba(255,224,200,.96);border-color:rgba(200,80,20,.55)}
  100%{transform:scale(1)}
}
.val{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.val small{font-size:11px;margin-left:2px;color:var(--ink-soft);font-weight:500}
.lv{
  margin-top:6px;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--butter);
  font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.16em;
}
.hint{
  position:absolute;left:0;right:0;top:64%;z-index:4;text-align:center;pointer-events:none;
  animation:fadeIn .4s ease both;
}
.hint-main{
  margin:0;font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:.14em;color:var(--ink);
  animation:pulse 1.1s ease-in-out infinite;
}
.hint-sub{margin:8px 0 0;font-size:13.5px;font-weight:500;color:var(--ink-soft)}
.toast{
  position:absolute;left:50%;top:92px;z-index:4;transform:translateX(-50%);pointer-events:none;
  padding:8px 16px;border-radius:999px;background:rgba(58,39,16,.92);color:var(--butter);white-space:nowrap;
  font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.14em;opacity:0;
}
.toast.go{animation:toastIn 1.5s ease both}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}

/* ---------- game over ---------- */
.over{
  justify-content:center;
  background:radial-gradient(ellipse at 50% 42%,rgba(255,247,227,.6),rgba(255,236,186,.9));
  backdrop-filter:blur(3px);
}
.panel,.card{box-sizing:border-box}
.panel{
  width:min(100%,340px);display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:22px 22px 14px;border-radius:30px;background:rgba(255,250,236,.92);
  border:1px solid rgba(201,131,0,.3);box-shadow:0 30px 60px -28px rgba(120,76,16,.55);
  animation:popUp .5s cubic-bezier(.2,1.3,.4,1) both;
}
.panel canvas{width:132px;height:120px;display:block;margin-top:2px}
.msg{margin:2px 0 0;font-size:14px;line-height:1.55;font-weight:500;color:var(--ink-soft);white-space:pre-line}
.scorebox{display:flex;flex-direction:column;align-items:center;gap:2px;margin:14px 0 0;position:relative}
.big{font-family:var(--font-display);font-weight:800;font-size:56px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.big small{font-size:16px;font-weight:600;color:var(--ink-soft);margin-left:4px;letter-spacing:.02em}
.newbest{
  margin-top:8px;padding:5px 11px;border-radius:999px;background:var(--gold);color:var(--ink);
  font-family:var(--font-display);font-weight:700;font-size:9.5px;letter-spacing:.18em;
}
.stats{display:flex;gap:6px;width:100%;margin:16px 0 18px;padding:12px 0;border-top:1px solid rgba(201,131,0,.25);border-bottom:1px solid rgba(201,131,0,.25)}
.stats div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.stats dt{font-family:var(--font-display);font-size:9px;letter-spacing:.2em;color:var(--ink-soft);font-weight:500}
.stats dd{margin:0;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- brand ending popup ---------- */
.modal{
  position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  background:rgba(58,39,16,.45);backdrop-filter:blur(4px);animation:fadeIn .3s ease both;
}
.card{
  position:relative;width:min(100%,380px);max-height:100%;overflow-y:auto;overflow-x:hidden;
  padding:26px 24px 22px;border-radius:30px;text-align:center;
  background:linear-gradient(180deg,#FFFCF1 0%,#FFF3D0 100%);
  box-shadow:0 36px 70px -24px rgba(58,39,16,.6);
  animation:popUp .55s cubic-bezier(.2,1.3,.4,1) both;
}
.card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,131,0,.4);border-radius:23px;pointer-events:none}
.close{
  position:absolute;top:14px;right:14px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(58,39,16,.07);color:var(--ink);display:grid;place-items:center;
}
.close:hover{background:rgba(58,39,16,.14)}
.tart-wrap{position:relative;margin-top:6px;padding-top:6px}
.tart-wrap::before{
  content:"";position:absolute;left:6%;right:6%;top:0;bottom:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,222,120,.75),rgba(255,222,120,0));
}
.tart{position:relative;display:block;width:54%;height:auto;margin:0 auto;filter:drop-shadow(0 16px 14px rgba(120,76,16,.35))}
.logo{display:block;width:80%;height:auto;margin:12px auto 20px}
.b-lead{margin:4px 0 0;font-family:var(--font-serif);font-weight:500;font-size:19px;line-height:1.7;color:var(--ink);text-wrap:balance}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 14px}
.orn::before,.orn::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-deep))}
.orn::after{transform:scaleX(-1)}
.orn i{width:6px;height:6px;rotate:45deg;background:var(--gold-deep)}
.b-sub{margin:0;font-size:13.5px;font-weight:500;letter-spacing:.08em;color:var(--ink-soft)}
.card .btn{width:100%;max-width:260px}
.card .btn-ghost{width:auto;margin-top:4px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popUp{from{opacity:0;transform:translateY(26px) scale(.93)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.7}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

</head>
<body>
<main id="stage">
  <canvas id="game" aria-label="YOLK IT BE 게임 화면"></canvas>

  <div id="hud" class="hud" hidden>
    <div class="stat"><span class="lbl">TIME</span><span class="val"><span id="hudTime">30.0</span><small>s</small></span></div>
    <div class="lv" id="hudLv">LV 1</div>
    <div class="stat r" id="hudScoreBox"><span class="lbl">SCORE</span><span class="val" id="hudScore">100</span><span class="meter"><i id="hudMeter"></i></span></div>
  </div>
  <div id="hint" class="hint" hidden>
    <p class="hint-main">TAP!</p>
    <p class="hint-sub">100점에서 시작해요<br>포크와 칼에 닿을 때마다 −10점</p>
  </div>
  <div id="toast" class="toast" hidden></div>

  <section id="start" class="screen start" aria-label="시작 화면">
    <div>
      <p class="eyebrow">LET EAT BE <span>MINI GAME</span></p>
      <h1 aria-label="YOLK IT BE"><span class="t1" aria-hidden="true">Y<i class="o"></i>LK</span><span class="t2" aria-hidden="true">IT BE</span></h1>
      <p class="sub">DON’T BREAK THE YOLK!</p>
      <p class="lead">탱글탱글 노른자,<br>어디까지 튀어 오를 수 있을까?</p>
    </div>
    <div class="start-bottom">
      <button id="btnStart" class="btn" type="button">START</button>
      <p class="how">TAP · CLICK · SPACE</p>
      <p id="startBest" class="best" hidden>BEST <b>0</b></p>
    </div>
  </section>

  <section id="over" class="screen over" aria-label="게임 오버" hidden>
    <div class="panel">
      <p class="eyebrow" id="overTitle">FINISH!</p>
      <canvas id="goYolk" width="264" height="240" aria-label="노른자 캐릭터"></canvas>
      <p class="msg" id="overMsg"></p>
      <div class="scorebox">
        <span class="lbl">FINAL SCORE</span>
        <span class="big"><span id="finalScore">0</span><small>/100</small></span>
        <span class="newbest" id="newBest" hidden>NEW BEST</span>
      </div>
      <dl class="stats">
        <div><dt>HIT</dt><dd id="finalHit">0</dd></div>
        <div><dt>PASSED</dt><dd id="finalPass">0</dd></div>
        <div><dt>BEST</dt><dd id="finalBest">0</dd></div>
      </dl>
      <button id="btnRetry" class="btn btn-ko" type="button">다시 도전하기</button>
      <button id="btnBrand" class="btn btn-ghost" type="button">LET EAT BE 이야기 보기</button>
    </div>
  </section>

  <div id="brand" class="modal" role="dialog" aria-modal="true" aria-label="LET EAT BE 브랜드 메시지" hidden>
    <div class="card">
      <button id="btnClose" class="close" type="button" aria-label="닫기">

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), cv = $('#game'), ctx = cv.getContext('2d');
const goCv = $('#goYolk'), goCtx = goCv.getContext('2d');
const el = {
  start:$('#start'), over:$('#over'), brand:$('#brand'), hud:$('#hud'), hint:$('#hint'), toast:$('#toast'),
  time:$('#hudTime'), score:$('#hudScore'), lv:$('#hudLv'),
  btnStart:$('#btnStart'), btnRetry:$('#btnRetry'), btnBrand:$('#btnBrand'), btnBrandRetry:$('#btnBrandRetry'), btnClose:$('#btnClose'),
  fScore:$('#finalScore'), fHit:$('#finalHit'), fPass:$('#finalPass'), fBest:$('#finalBest'), newBest:$('#newBest'),
  startBest:$('#startBest'), scoreBox:$('#hudScoreBox'), meter:$('#hudMeter'),
  overTitle:$('#overTitle'), overMsg:$('#overMsg')
};
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- world constants (logical units; world is always 640 tall) ---------- */
const H = 640, FLOOR = H - 64, ATTRACT = H * 0.66;
const R = 22, HIT = 18.5;
const GRAV = 1550, JUMP = -520, MAXFALL = 900;
const DURATION = 30, HIT_COST = 10, INVULN = 1.3;   // a run lasts 30s; start at 100 points, each hit costs 10
let W = 360, DPR = 1;

/* ---------- state ---------- */
let state = 'start';            // start | ready | play | ending | over
let clock = 0, t = 0, passed = 0, score = 100, hits = 0, level = 1, invuln = 0, endT = 0, overLook = 'happy';
let best = 0, spawnIn = 0, lastCenter = FLOOR / 2, shake = 0, flash = 0;
let floorA = 0, bgScroll = 0, popupTimer = 0, enableTimer = 0, toastTimer = 0;
let obs = [], parts = [];
const Y = { x: 0, y: ATTRACT - R, vy: 0, d: 0, dv: 0, rest: 0, wob: 0, ph: 0, look: 'happy', ouchT: 0, blink: 0, blinkT: 2 };
try { best = parseInt(localStorage.getItem('yolkItBeBest100') || '0', 10) || 0; } catch (e) { best = 0; }

const bokeh = [];
for (let i = 0; i < 16; i++) bokeh.push({ x: Math.random() * 700, y: Math.random() * H, r: 5 + Math.random() * 22, a: .08 + Math.random() * .14, v: .15 + Math.random() * .3, w: Math.random() < .35 });

function show(e, v) { e.hidden = !v; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* ---------- difficulty curve ---------- */
const curSpeed = () => Math.min(170 + t * 5.2, 310);
const curGap = () => Math.max(172, 240 - t * 2.3);
const curSpacing = () => Math.max(250, 320 - t * 2.2);

/* ---------- sizing ---------- */
function fit() {
  const r = stage.getBoundingClientRect();
  if (!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = clamp(Math.round(H * r.width / r.height), 250, 640);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
}

/* ---------- yolk character ---------- */
function drawYolk(c, x, y, r, o) {
  c.save();
  c.translate(x, y);
  c.scale(o.sx, o.sy);
  const N = 56;
  c.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2;
    const k = 1 + o.wob * (Math.sin(3 * a + o.ph) + 0.6 * Math.sin(2 * a - 1.3 * o.ph));
    const px = Math.cos(a) * r * k, py = Math.sin(a) * r * k;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
  c.shadowColor = 'rgba(217,143,0,.35)'; c.shadowBlur = r * .5; c.shadowOffsetY = r * .18;
  let g = c.createRadialGradient(-r * .36, -r * .42, r * .04, 0, 0, r * 1.08);
  g.addColorStop(0, '#FFF4B5'); g.addColorStop(.26, '#FFE064'); g.addColorStop(.62, '#FFC01A');
  g.addColorStop(.88, '#F39B00'); g.addColorStop(1, '#DB8100');
  c.fillStyle = g; c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  c.save(); c.clip();
  g = c.createRadialGradient(0, r * 1.05, 0, 0, r * 1.05, r * .9);
  g.addColorStop(0, 'rgba(255,236,150,.65)'); g.addColorStop(1, 'rgba(255,236,150,0)');
  c.fillStyle = g; c.fillRect(-r * 1.4, -r * 1.4, r * 2.8, r * 2.8);
  c.restore();
  c.lineWidth = Math.max(1, r * .05); c.strokeStyle = 'rgba(190,105,0,.45)'; c.stroke();

  // glossy highlights
  c.save(); c.translate(-r * .38, -r * .45); c.rotate(-.55);
  g = c.createLinearGradient(-r * .3, 0, r * .3, 0);
  g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,.35)');
  c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, r * .3, r * .15, 0, 0, Math.PI * 2); c.fill(); c.restore();
  c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.arc(-r * .02, -r * .7, r * .055, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(255,255,255,.28)'; c.beginPath(); c.arc(r * .5, r * .52, r * .07, 0, Math.PI * 2); c.fill();

  // face
  const ey = r * .12, ex = r * .3, ink = '#3A2710';
  c.fillStyle = ink; c.strokeStyle = ink; c.lineCap = 'round'; c.lineWidth = r * .075;
  if (o.look === 'dizzy') {
    for (const s of [-1, 1]) {
      const q = r * .075;
      c.beginPath(); c.moveTo(s * ex - q, ey - q); c.lineTo(s * ex + q, ey + q);
      c.moveTo(s * ex + q, ey - q); c.lineTo(s * ex - q, ey + q); c.stroke();
    }
    c.beginPath(); c.ellipse(0, r * .38, r * .09, r * .07, 0, 0, Math.PI * 2); c.fill();
  } else if (o.look === 'ouch') {
    const q = r * .075;
    for (const s of [-1, 1]) {
      c.beginPath(); c.moveTo(s * ex + s * q, ey - q); c.lineTo(s * ex - s * q, ey); c.lineTo(s * ex + s * q, ey + q); c.stroke();
    }
    c.beginPath(); c.ellipse(0, r * .36, r * .09, r * .07, 0, 0, Math.PI * 2); c.fill();
  } else {
    if (o.blink) {
      for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * ex - r * .08, ey); c.lineTo(s * ex + r * .08, ey); c.stroke(); }
    } else {
      for (const s of [-1, 1]) {
        c.fillStyle = ink; c.beginPath(); c.ellipse(s * ex, ey, r * .085, r * .12, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#fff'; c.beginPath(); c.arc(s * ex - r * .025, ey - r * .045, r * .032, 0, Math.PI * 2); c.fill();
      }
    }
    c.beginPath(); c.arc(0, r * .24, r * .13, .12 * Math.PI, .88 * Math.PI); c.stroke();
  }
  c.fillStyle = 'rgba(255,110,30,.26)';
  for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * r * .54, r * .3, r * .13, r * .075, 0, 0, Math.PI * 2); c.fill(); }
  c.restore();
}

function squash(a) { Y.d = a; Y.dv = 0; Y.wob = Math.max(Y.wob, .07); }
function springStep(dt) {
  const k = 420, cc = 15;
  const a = -k * (Y.d - Y.rest) - cc * Y.dv;
  Y.dv += a * dt; Y.d += Y.dv * dt; Y.d = clamp(Y.d, -.3, .6);
  Y.wob *= Math.exp(-4.2 * dt); Y.ph += dt * 24;
  Y.blinkT -= dt;
  if (Y.blinkT <= 0) { Y.blink = .12; Y.blinkT = 2 + Math.random() * 2.5; }
  if (Y.blink > 0) Y.blink -= dt;
}

/* ---------- particles ---------- */
function burst(x, y, n, kind) {
  for (let i = 0; i < n; i++) {
    const drop = kind === 'drop';
    const a = drop ? (-Math.PI * (.1 + Math.random() * .8)) : (Math.random() * Math.PI * 2);
    const sp = drop ? 160 + Math.random() * 260 : 30 + Math.random() * 70;
    parts.push({ kind, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: drop ? .6 + Math.random() * .4 : .35 + Math.random() * .25, r: drop ? 2.5 + Math.random() * 3.5 : 3 + Math.random() * 4 });
  }
}
function floatText(txt, x, y, neg) { parts.push({ kind: 'text', t: txt, x, y, vx: 0, vy: -50, life: 0, max: .9, r: 0, neg: !!neg }); }
function stepParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    if (p.kind === 'drop') p.vy += 1200 * dt;
    else if (p.kind === 'puff') { p.vx *= .95; p.vy *= .95; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

/* ---------- utensils ---------- */
function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r); c.arcTo(x + w, y + h, x + w - r, y + h, r); c.lineTo(x + r, y + h);
  c.arcTo(x, y + h, x, y + h - r, r); c.lineTo(x, y + r); c.arcTo(x, y, x + r, y, r); c.closePath();
}
function forkGeom(L) {
  const k = Math.min(1, L / 92), tl = 40 * k, hb = 14 * k, nh = 24 * k;
  return { tl, hb, nh, hl: L - tl - hb - nh, hw: 22, tw: (44 - 12) / 4 };
}
function forkPath(c, L) {
  const g = forkGeom(L), yn = -(g.hl + g.nh), yb = yn - g.hb, hw = g.hw, tw = g.tw;
  c.beginPath();
  c.moveTo(-7, 0); c.lineTo(-5, -g.hl);
  c.quadraticCurveTo(-5, yn + g.nh * .25, -hw, yn - 1);
  c.lineTo(-hw, -L + tw / 2);
  for (let i = 0; i < 4; i++) {
    const x0 = -hw + i * (tw + 4);
    c.arc(x0 + tw / 2, -L + tw / 2, tw / 2, Math.PI, 0);
    if (i < 3) { c.lineTo(x0 + tw, yb); c.lineTo(x0 + tw + 4, yb); c.lineTo(x0 + tw + 4, -L + tw / 2); }
  }
  c.lineTo(hw, yn - 1);
  c.quadraticCurveTo(5, yn + g.nh * .25, 5, -g.hl);
  c.lineTo(7, 0); c.closePath();
}
function steel(c, x0, x1) {
  const g = c.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, '#9CA2AB'); g.addColorStop(.3, '#F6F8FA'); g.addColorStop(.62, '#C4C9D0'); g.addColorStop(1, '#8B919B');
